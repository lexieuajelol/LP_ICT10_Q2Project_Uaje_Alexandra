<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Element Checker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css " rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>

<style>
    body {
    background-color: rgb(226, 219, 235);
}

.title {
    background-color: rgb(163, 173, 212);
}


h2 {
    font-family: Arial, Helvetica, sans-serif;
    font-weight: bold;
    padding: 15px;
    color: white;
}

h5 {
    font-family: Arial, Helvetica, sans-serif;
    font-weight: light;
    padding: 15px;
    color: white;
}

h6 {
    font-family: Arial, Helvetica, sans-serif;
    padding: 10px;
    display: flex;
}


.container-round {
    margin-top: 50px;
    align-content: center;
}

.btn {
    width: 98%;
    margin: 5px;
    background-color: #57a564;
}


.elementChecker {
    background-color: rgb(255, 255, 255);
    padding: 5px;
    margin: 5px;
    display: block;
}

.instructions {
    background-color: rgb(212, 212, 212);
    padding: 5px;
    margin: 5px;
    display: block;
}

label {
    font-family: Arial, Helvetica, sans-serif;
    margin-left: 5px;
    font-weight: bold;
}

.result {
    margin-left: 10px;
    margin-bottom: 10px;
}
</style>
</head>
<body>
    <nav class="navbar navbar-expand-sm navbar-light bg-light">

        <div class="container-fluid">

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mynavbar">
            <span class="navbar-toggler-icon"> </span>
            </button>


            <div class="collapse navbar-collapse" id="mynavbar">

                <ul class="navbar-nav me-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="index.html" target="_self"> Meet the Creator </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="" target="_self"> Element Checker </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="club.html"> Club Member Checker </a>
                    </li>

                </ul>

            </div>

        </div>

    </nav>

    <div class="container-round">
        <div class="card mx-auto" style="max-width: 550px">        
            <div class="title">
            <h2>Non-Metal Elements: Periodic Table Information Finder</h2>
            </div>

            <div class="instructions">
            <label>Instructions: Enter the SYMBOL of a non-metal element (Example: H, O, Cl, Ne, Xe)</label>
            </div>
            
            <div class="elementChecker">
            <label>Element Symbol</label>
            <input type="text" class="form-control" id="Element" placeholder="Enter">
            </div>

            <div class="button">
           <button class="btn btn-success form-control" py-click="element_Checker">Check Details</button>
            </div>

            <div class="result">
           <h6>Your result will appear here.</h6>
            </div>

            <div id="output" class="result">
            </div>
    
    </div>
    </div>

<script type="py" src="main.py"></script>
</body>
</html>
